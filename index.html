<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sports Domain Tracker</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --ink: #1b1f24; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2563eb; --done: #16a34a; --warn: #d97706; --chip: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --panel: #171a21; --ink: #e6e8eb; --muted: #9aa3af; --line: #2a2f39;
            --accent: #60a5fa; --done: #4ade80; --warn: #fbbf24; --chip: #1e2533; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
           padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
           position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 18px; margin: 0; flex: 1; cursor: pointer; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
           padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .layout { display: grid; grid-template-columns: 230px 1fr; min-height: calc(100vh - 60px); }
  nav { border-right: 1px solid var(--line); padding: 12px; background: var(--panel); }
  nav a { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px;
          color: inherit; text-decoration: none; cursor: pointer; }
  nav a:hover { background: var(--chip); }
  nav a.active { background: var(--chip); font-weight: 600; }
  nav a .pct { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  main { padding: 20px; max-width: 1100px; }
  .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .bar.full > i { background: var(--done); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .sportcard { cursor: pointer; }
  .sportcard:hover { border-color: var(--accent); }
  .sportcard h3 { margin: 0 0 2px; font-size: 16px; }
  .meta { color: var(--muted); font-size: 13px; }
  .minirow { display: grid; grid-template-columns: 1fr 70px 38px; gap: 8px; align-items: center;
             font-size: 12px; margin-top: 6px; color: var(--muted); }
  .minirow span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .summary { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          padding: 12px 16px; min-width: 150px; }
  .stat b { font-size: 24px; display: block; font-variant-numeric: tabular-nums; }
  .sporthead { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .sporthead h2 { margin: 0; font-size: 22px; }
  .sporthead .grow { flex: 1; min-width: 200px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; }
  .cat h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .cat h3 .count { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 13px; }
  .cat .bar { margin: 8px 0 6px; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.item { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: start;
            padding: 7px 0; border-top: 1px solid var(--line); }
  li.item:first-child { border-top: 0; }
  li.item input[type=checkbox] { width: 17px; height: 17px; margin-top: 2px; accent-color: var(--done); cursor: pointer; }
  li.item.done .txt { text-decoration: line-through; color: var(--muted); }
  .qty { display: inline-block; background: var(--chip); border-radius: 6px; padding: 0 6px;
         font-size: 12px; margin-left: 6px; white-space: nowrap; }
  .note { color: var(--muted); font-size: 12.5px; }
  .tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--warn);
         margin-left: 6px; }
  .rowbtns { display: flex; gap: 2px; opacity: .25; }
  li.item:hover .rowbtns, li.item:focus-within .rowbtns { opacity: 1; }
  .rowbtns button { padding: 2px 6px; font-size: 12px; border: 0; background: transparent; }
  .rowbtns button:hover { background: var(--chip); }
  form.add { display: flex; gap: 6px; margin-top: 8px; }
  form.add input, .edit input { font: inherit; padding: 5px 8px; border: 1px solid var(--line);
         border-radius: 8px; background: var(--bg); color: var(--ink); min-width: 0; }
  form.add input[name=text] { flex: 1; }
  form.add input[name=qty] { width: 80px; }
  .edit { display: grid; gap: 4px; }
  .edit .r { display: flex; gap: 4px; }
  .edit input[name=text] { flex: 1; }
  .edit input[name=qty] { width: 90px; }
  label.toggle { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .hidden { display: none !important; }
  .empty { color: var(--muted); font-size: 13px; padding: 6px 0; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    nav { border-right: 0; border-bottom: 1px solid var(--line); display: flex; overflow-x: auto; gap: 4px; }
    nav a { white-space: nowrap; }
    nav a .pct { display: none; }
    main { padding: 16px; }
    .cats { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1 id="home">🏆 Sports Domain Tracker</h1>
  <button id="exportBtn" title="Download a backup of all checklists">Export</button>
  <button id="importBtn" title="Restore from a backup file">Import</button>
  <input type="file" id="importFile" accept="application/json" class="hidden">
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<script src="data.js"></script>
<script>
const KEY = "sportsTracker.v1";
let state = load();
let view = location.hash.slice(1) || "overview";
let pendingOnly = false;
let editing = null; // "sportId|cat|itemId"

function uid() { return Math.random().toString(36).slice(2, 10); }

function seedSport(s) {
  const out = { id: s.id, name: s.name, emoji: s.emoji, meta: s.meta, cats: {} };
  for (const c of CATEGORIES) {
    out.cats[c.key] = (s[c.key] || []).map(i => ({ id: uid(), ...i, done: false }));
  }
  return out;
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { sports: SEED.map(seedSport) };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function stats(items) {
  const done = items.filter(i => i.done).length;
  return { done, total: items.length, pct: items.length ? Math.round(done / items.length * 100) : 0 };
}
function sportItems(s) { return CATEGORIES.flatMap(c => s.cats[c.key] || []); }
function bar(p) { return `<div class="bar ${p === 100 ? "full" : ""}"><i style="width:${p}%"></i></div>`; }
function findSport(id) { return state.sports.find(s => s.id === id); }

function render() {
  renderNav();
  const s = findSport(view);
  if (s) renderSport(s); else renderOverview();
}

function renderNav() {
  const all = stats(state.sports.flatMap(sportItems));
  let html = `<a data-go="overview" class="${view === "overview" ? "active" : ""}">📊 Overview <span class="pct">${all.pct}%</span></a>`;
  for (const s of state.sports) {
    const st = stats(sportItems(s));
    html += `<a data-go="${s.id}" class="${view === s.id ? "active" : ""}">${s.emoji} ${esc(s.name)} <span class="pct">${st.pct}%</span></a>`;
  }
  document.getElementById("nav").innerHTML = html;
}

function renderOverview() {
  const all = state.sports.flatMap(sportItems);
  const st = stats(all);
  const ready = state.sports.filter(s => stats(sportItems(s)).pct === 100).length;
  let html = `<div class="summary">
    <div class="stat"><b>${st.pct}%</b><span class="meta">overall complete</span></div>
    <div class="stat"><b>${st.done}/${st.total}</b><span class="meta">items checked off</span></div>
    <div class="stat"><b>${ready}/${state.sports.length}</b><span class="meta">sports fully ready</span></div>
  </div>`;

  // Category totals across all sports
  html += `<div class="card" style="margin-bottom:18px"><h3 style="margin:0 0 4px;font-size:15px">By category (all sports)</h3>`;
  for (const c of CATEGORIES) {
    const cs = stats(state.sports.flatMap(s => s.cats[c.key] || []));
    html += `<div class="minirow" style="grid-template-columns:220px 1fr 70px;font-size:13px">
      <span>${c.icon} ${c.label}</span>${bar(cs.pct)}<span>${cs.done}/${cs.total}</span></div>`;
  }
  html += `</div><div class="grid">`;

  for (const s of state.sports) {
    const ss = stats(sportItems(s));
    html += `<div class="card sportcard" data-go="${s.id}">
      <h3>${s.emoji} ${esc(s.name)}</h3><div class="meta">${esc(s.meta)}</div>
      <div style="margin:10px 0 4px;display:flex;justify-content:space-between;font-size:13px">
        <span>${ss.done}/${ss.total} done</span><b>${ss.pct}%</b></div>${bar(ss.pct)}`;
    for (const c of CATEGORIES) {
      const cs = stats(s.cats[c.key] || []);
      html += `<div class="minirow"><span>${c.icon} ${c.label}</span>${bar(cs.pct)}<span>${cs.done}/${cs.total}</span></div>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  document.getElementById("main").innerHTML = html;
}

function renderSport(s) {
  const st = stats(sportItems(s));
  let html = `<div class="sporthead">
    <div class="grow"><h2>${s.emoji} ${esc(s.name)}</h2><div class="meta">${esc(s.meta)}</div>
      <div style="margin-top:8px;max-width:360px">${bar(st.pct)}</div>
      <div class="meta" style="margin-top:4px">${st.done}/${st.total} done · ${st.pct}%</div></div>
    <div class="tools">
      <label class="toggle"><input type="checkbox" id="pendingOnly" ${pendingOnly ? "checked" : ""}> Pending only</label>
      <button data-act="reset" title="Restore this sport's checklist from the sheet">Reset to sheet</button>
    </div></div><div class="cats">`;

  for (const c of CATEGORIES) {
    const items = s.cats[c.key] || [];
    const cs = stats(items);
    const shown = pendingOnly ? items.filter(i => !i.done) : items;
    html += `<section class="card cat" data-cat="${c.key}">
      <h3>${c.icon} ${c.label}<span class="count">${cs.done}/${cs.total}</span></h3>${bar(cs.pct)}<ul class="items">`;
    if (!shown.length) html += `<li class="empty">${items.length ? "All done ✓" : "Nothing here yet — add an item below."}</li>`;
    for (const i of shown) {
      const key = `${s.id}|${c.key}|${i.id}`;
      if (editing === key) {
        html += `<li class="item"><span></span><form class="edit" data-id="${i.id}">
          <div class="r"><input name="text" value="${esc(i.text)}" required><input name="qty" value="${esc(i.qty)}" placeholder="Qty"></div>
          <div class="r"><input name="note" value="${esc(i.note)}" placeholder="Note" style="flex:1">
          <button class="primary">Save</button><button type="button" data-act="cancel">Cancel</button></div></form><span></span></li>`;
        continue;
      }
      html += `<li class="item ${i.done ? "done" : ""}">
        <input type="checkbox" data-act="toggle" data-id="${i.id}" ${i.done ? "checked" : ""}>
        <div><span class="txt">${esc(i.text)}</span>${i.qty ? `<span class="qty">${esc(i.qty)}</span>` : ""}${i.src === "suggested" ? `<span class="tag" title="Not from the sheet — a suggested task">suggested</span>` : ""}
          ${i.note ? `<div class="note">${esc(i.note)}</div>` : ""}</div>
        <div class="rowbtns"><button data-act="edit" data-id="${i.id}" title="Edit">✎</button><button data-act="del" data-id="${i.id}" title="Delete">✕</button></div>
      </li>`;
    }
    html += `</ul><form class="add"><input name="text" placeholder="Add item…" required><input name="qty" placeholder="Qty"><button>Add</button></form></section>`;
  }
  html += `</div>`;
  document.getElementById("main").innerHTML = html;
}

function go(v) { view = v; editing = null; location.hash = v === "overview" ? "" : v; render(); window.scrollTo(0, 0); }

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) return go(g.dataset.go);
  const a = e.target.closest("[data-act]");
  if (!a) return;
  const s = findSport(view);
  const sec = a.closest("[data-cat]");
  const list = s && sec ? s.cats[sec.dataset.cat] : null;
  const act = a.dataset.act;
  if (act === "toggle") {
    const it = list.find(i => i.id === a.dataset.id); it.done = a.checked;
  } else if (act === "del") {
    const it = list.find(i => i.id === a.dataset.id);
    if (!confirm(`Delete "${it.text}"?`)) return;
    list.splice(list.indexOf(it), 1);
  } else if (act === "edit") {
    editing = `${s.id}|${sec.dataset.cat}|${a.dataset.id}`;
  } else if (act === "cancel") {
    editing = null;
  } else if (act === "reset") {
    if (!confirm(`Reset ${s.name} to the sheet defaults? Your ticks and edits for this sport will be lost.`)) return;
    const fresh = seedSport(SEED.find(x => x.id === s.id));
    state.sports[state.sports.indexOf(s)] = fresh;
  } else return;
  save(); render();
});

document.addEventListener("change", e => {
  if (e.target.id === "pendingOnly") { pendingOnly = e.target.checked; render(); }
});

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, s = findSport(view), cat = f.closest("[data-cat]").dataset.cat;
  const d = Object.fromEntries(new FormData(f));
  if (!d.text.trim()) return;
  if (f.classList.contains("add")) {
    s.cats[cat].push({ id: uid(), text: d.text.trim(), qty: d.qty.trim(), note: "", src: "user", done: false });
  } else {
    const it = s.cats[cat].find(i => i.id === f.dataset.id);
    Object.assign(it, { text: d.text.trim(), qty: d.qty.trim(), note: d.note.trim() });
    editing = null;
  }
  save(); render();
  if (f.classList.contains("add")) document.querySelector(`[data-cat="${cat}"] form.add input`).focus();
});

document.getElementById("home").onclick = () => go("overview");
document.getElementById("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `sports-tracker-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
};
document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.sports)) throw new Error("bad file");
    state = data; save(); go("overview");
  } catch (err) { alert("That file doesn't look like a tracker backup."); }
  e.target.value = "";
};
window.addEventListener("hashchange", () => { const v = location.hash.slice(1) || "overview"; if (v !== view) { view = v; render(); } });

render();
</script>
</body>
</html>
